<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="stylesheet"
            href="/layers.css"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon-16x16.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <link
            rel="manifest"
            href="/manifest.json"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Komga</title>
        <script th:inline="javascript">
            /*<![CDATA[*/
            window.resourceBaseUrl = /*[(${"'" + baseUrl + "'"})]*/ '/'
            /*]]>*/
        </script>
        <script>
            // Register before the application bundles execute. This is intentionally
            // independent from Vue bootstrap so an installed PWA can acquire an
            // active worker even if a later API/bootstrap request fails.
            ;(function () {
                if (!('serviceWorker' in navigator)) return
                var base = window.resourceBaseUrl || '/'
                if (base.charAt(base.length - 1) !== '/') base += '/'
                var workerUrl = new URL('service-worker.js', window.location.origin + base).href
                window.__komgaServiceWorkerRegistration = navigator.serviceWorker
                    .register(workerUrl, { scope: base })
                    .then(function (registration) {
                        // Explicitly check for updated worker code whenever Komga is
                        // opened online; installed PWAs otherwise may retain an old
                        // worker longer than expected.
                        registration.update().catch(function () {})
                        return registration
                    })
                    .catch(function () {
                        return undefined
                    })
            })()
        </script>
        <script>
            window.buildUrl = (filename) => {
                return `${window.resourceBaseUrl}${filename}`
            }
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script
            type="module"
            src="/src/main.ts"
        ></script>
    </body>
</html>
